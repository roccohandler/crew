# XcodeGen spec — generates ios/Crew.xcodeproj on a Mac: `brew install xcodegen && cd ios && xcodegen generate`
# SPEC: Part IV (Swift/SwiftUI, iOS 17+, iPhone-only, portrait-only 6.7, ZERO third-party dependencies) ·
# Part V 5.2 (targets: Crew, CrewTests, CrewUITests) · T007. Written on Windows — UNVERIFIED until run on a Mac.
name: Crew
options:
  bundleIdPrefix: com.yourteam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Crew:
    type: application
    platform: iOS
    sources:
      - path: Crew
        excludes:
          - "**/.DS_Store"
    resources:
      - path: ../shared/vectors
        buildPhase: none
    info:
      path: Crew/Info.plist
      properties:
        CFBundleDisplayName: Crew
        CFBundleName: Crew
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "Snap your plates and your progress. Real plates, real Tupperware — nothing to be self-conscious about."
        NSPhotoLibraryUsageDescription: "Pick a photo from your library to post to your crew."
        NSPhotoLibraryAddUsageDescription: "Save a photo you took in Crew."
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # a Debug build talks to a dev server on your machine over http; Release is https only
        # Api.configuredBaseURL() reads these two; the values come from the build settings below (override either on the
        # xcodebuild command line, e.g. CREW_API_HOST=192.168.1.30:3000 for a phone on your desk, or your Vercel host).
        CrewApiScheme: $(CREW_API_SCHEME)
        CrewApiHost: $(CREW_API_HOST)
    entitlements:
      path: Crew/Crew.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.developer.associated-domains: ["applinks:crew.example"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.crew
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # Crew/Assets.xcassets/AppIcon.appiconset holds the single 1024 px icon (Xcode derives every size and writes
        # CFBundleIconName); App Store Connect refuses an upload without it (ITMS 90022/90713, first TestFlight run).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Release (TestFlight, the App Store) talks to the deployed server over https; set CREW_API_HOST to your Vercel host.
        CREW_API_SCHEME: https
        CREW_API_HOST: crew.example.com
      configs:
        # Debug (simulator, a device plugged into your Mac, the XCUITest journeys) talks to the local harness:
        # `cd web && node tests/e2e/dev-server.mjs`. From a PHYSICAL device, localhost is the phone itself — pass your
        # machine's address instead: xcodebuild ... CREW_API_HOST=192.168.1.30:3000
        Debug:
          CREW_API_SCHEME: http
          CREW_API_HOST: localhost:3000
  CrewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrewTests
      - path: ../shared/vectors
        type: folder
        buildPhase: resources
    dependencies:
      - target: Crew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.crew.tests
        # A signed bundle needs an Info.plist — Xcode writes this one (run 34371679615: the first ad-hoc-signed CI build stopped
        # here; unsigned builds never asked)
        GENERATE_INFOPLIST_FILE: YES
  CrewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CrewUITests
    dependencies:
      - target: Crew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.crew.uitests
        GENERATE_INFOPLIST_FILE: YES # as CrewTests: the signed runner app needs one
schemes:
  Crew:
    build:
      targets:
        Crew: all
        CrewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CrewTests
      gatherCoverageData: true
  CrewUITests:
    build:
      targets:
        Crew: all
        CrewUITests: [test]
    test:
      config: Debug
      targets:
        - CrewUITests
