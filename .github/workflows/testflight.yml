# Build the iPhone app on GitHub's macOS runners and deliver it to TestFlight — the whole path from a machine that is not
# a Mac. Run it by hand: Actions → "testflight" → Run workflow.
# SPEC: XI T045 (TestFlight + web beta) · Part X Phases 6–7 · docs/testing-without-a-mac.md (the owner's step list).
#
# Secrets it needs (Settings → Secrets and variables → Actions), all from App Store Connect:
#   APP_STORE_CONNECT_KEY_ID          the key's ID, e.g. 7X4KP2W9AB   (Users and Access → Integrations → App Store Connect API)
#   APP_STORE_CONNECT_ISSUER_ID       the issuer UUID on that same page
#   APP_STORE_CONNECT_PRIVATE_KEY     the whole .p8 file, pasted (it is downloadable exactly once)
#   APPLE_TEAM_ID                     the 10-character team id (Membership details)
# Variables (same page, "Variables" tab):
#   CREW_BUNDLE_ID                    e.g. com.yourname.crew — must already exist as an app in App Store Connect
#   CREW_API_HOST                     the deployed server, e.g. crew-yourname.vercel.app (no scheme, no trailing slash)
name: testflight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (must be higher than the last upload)"
        required: true
        default: "1"

jobs:
  upload:
    name: archive · sign · upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen

      # The bundle id and the server come from repository variables, so nothing in the repo names your account.
      - name: Point the project at your bundle id
        run: sed -i '' "s/com.yourteam.crew/${{ vars.CREW_BUNDLE_ID }}/g" ios/project.yml
      - run: cd ios && xcodegen generate

      # The API key file: xcodebuild reads it to create the signing certificate and profile itself (no .p12 to export).
      - name: Write the App Store Connect key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Archive
        run: >
          cd ios && xcodebuild archive
          -project Crew.xcodeproj -scheme Crew -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/Crew.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          CURRENT_PROJECT_VERSION=${{ inputs.build_number }}
          CREW_API_HOST=${{ vars.CREW_API_HOST }}

      - name: Export and upload
        run: >
          cd ios && xcodebuild -exportArchive
          -archivePath build/Crew.xcarchive -exportPath build/export
          -exportOptionsPlist ExportOptions.plist
          -allowProvisioningUpdates
          -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Forget the key
        if: always()
        run: rm -rf ~/private_keys
