# SPEC: Part X Phase 1 exit gate (CI green incl. vector harness on both engines; standing API checks; check-drift) ·
# 5.3 (doctrine lint CI-blocking; formatting machine-owned) · 8.1 (a red vector on either engine blocks every merge) · T008
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  contracts:
    name: shared contracts (generate · drift · vectors · seeds · doctrine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node shared/scripts/generate.mjs
      - run: node shared/scripts/check-drift.mjs
      - run: node shared/scripts/check-vectors.mjs
      - run: node shared/scripts/check-seeds.mjs
      - run: node shared/scripts/doctrine-lint.mjs
      # The Swift cross-reference check (removed enum cases, renamed parameters, a shadowed SwiftUI type) fails here in a
      # minute instead of on the macOS job ten minutes later — and it is the same command the Windows build machine runs.
      - run: node shared/scripts/swift-xref.mjs

  web:
    name: web (lint · typecheck · test · vectors)
    runs-on: ubuntu-latest
    needs: contracts
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run vectors
      - run: npm run build

  web-e2e:
    name: web e2e (Playwright journeys ①–④, 375 / 768 / 1280)
    runs-on: ubuntu-latest
    needs: web
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit # phone-375 runs on WebKit (iPhone descriptor)
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }

  engine-swift:
    # The twin engine on the OPEN-SOURCE toolchain: no Xcode, no macOS runner, no minutes multiplier. ios/Package.swift
    # builds Engine/ + Generated/ and runs the vector runners, so 8.1 ("a red vector on EITHER engine blocks every merge")
    # is enforced on every push instead of waiting for a Mac. The app half (SwiftUI, SwiftData) is the `ios` job below.
    name: ios engine (swift build · unit + vectors, Linux)
    runs-on: ubuntu-latest
    needs: contracts
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: cd ios && swift build
      - run: cd ios && swift test

  ios:
    # Runs on GitHub's macOS runners (Xcode present) — the only place this repo's SwiftUI is verified until the
    # owner opens it on a Mac. Continuous-build rule 3a: every iOS task is WRITTEN — UNVERIFIED until this job is green.
    name: ios (xcodegen · build · unit + vectors · journeys ①②)
    runs-on: macos-latest
    timeout-minutes: 45 # a hung simulator must not burn the six-hour default; a green run is 6–7½ minutes, most of it the journeys
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: bash ios/scripts/doctrine-lint.sh
      # 8.4: the XCUITest journeys talk to the same local harness Playwright uses (in-memory Mongo + next dev on :3000);
      # journey ① registers a fresh account and journey ② seeds itself through the API (SeedClient).
      - run: cd web && npm ci
      - run: cd web && nohup node tests/e2e/dev-server.mjs > dev-server.log 2>&1 &
      # `next dev` compiles each API route on its first hit; the journeys' waits assume a warm server (the same list the
      # Playwright warm-up fetches — web/tests/e2e/warm-up.ts). Any status is fine, the compile is the point. When the
      # server never comes up, say so and print its log — a bare 180 s `wait-on` timeout tells the reader nothing.
      - name: wait for the harness · warm every route the journeys hit
        shell: bash
        run: |
          if ! npx --yes wait-on http://localhost:3000/login --timeout 180000; then
            echo "::error title=Local API harness::the dev server never answered on :3000 — the journeys cannot run. web/dev-server.log:"
            cat web/dev-server.log || echo "(no dev-server.log — npm ci never got that far)"
            exit 1
          fi
          for route in auth/register auth/login auth/logout auth/refresh auth/reset users/me plans sessions sessions/warm-up posts posts/warm-up posts/warm-up/reactions crews "crews/join?token=warm-up" crews/warm-up/stream crews/warm-up/messages crews/warm-up/members sync pause photos; do
            curl -s -o /dev/null "http://localhost:3000/api/v1/$route" || true
          done
      # The runner image decides which simulators exist (first run, 2026-09-08: Xcode 26.6 ships iPhone 16e / 17 / 17 Pro
      # and no "iPhone 16"), so the device is not hard-coded: the newest plain "iPhone NN" on the image is picked at run time.
      - run: |
          CREW_SIM=$(xcrun simctl list devices available | grep -oE '^ +iPhone [0-9]+ \(' | sed -E 's/^ +//; s/ \($//' | sort -t ' ' -k 2 -n | tail -n 1)
          test -n "$CREW_SIM"
          echo "Simulator: $CREW_SIM"
          echo "CREW_SIM=$CREW_SIM" >> "$GITHUB_ENV"
      # ONE xcodebuild invocation, on a scheme (CrewAll, ios/project.yml) that carries BOTH test bundles.
      #
      # This job used to run `xcodebuild test` twice, once per scheme, which compiled the 151-file app twice. Run
      # 34542854485 tried to fix that with `build-for-testing` + 2× `test-without-building` and made the job **86%
      # slower** — 6m11s → 11m31s. Three measured runs, from xcodebuild's own `IDETestOperationsObserverDebug` counter
      # (the gap between "Testing started" and the first test case) rather than from subtracting test time out of step
      # time, which silently hands that gap to the compiler:
      #
      #                        compiling   simulator prep   tests     job       run
      #   2× xcodebuild test    30 + 21     60.5 + 61.2      153 s    6m11s     34540455856
      #   build + 2× t-w-b      46          149.5 + 189.4    226 s    11m31s    34542854485
      #   1× xcodebuild test    38          169.6            188 s    7m34s     34544705389  ← green
      #
      # Read that third row honestly: one invocation saves ONE COMPILE (~13–21 s) and nothing else. It does NOT prepare
      # the simulator once — preparation still contains two install cycles, the host app for CrewTests and then the UI
      # runner app for CrewUITests, and no scheme arrangement can merge those. The remaining spread between 6m11s and
      # 7m34s is macOS runner variance, which is ±60 s and swamps the compile saving. So this shape is kept because it
      # is the simplest thing that is not wasteful, NOT because it is measurably faster. Before changing it again, read
      # the counter in three runs, not one. `-only-testing:` is gone with it; both bundles run in one pass, so a failure
      # in either is still reported by the same run.
      #
      # Simulator builds are signed AD HOC (`-`: no certificate, no team, no profile) with the entitlements embedded. Unsigned
      # (CODE_SIGNING_ALLOWED=NO, until 2026-09-09) the app had no entitlements at all, and on a simulator that makes every
      # Keychain write fail with errSecMissingEntitlement (-34018): the session lived in memory only, so a kill-and-relaunch
      # woke on the hero and the offline journey could never pass (run 34367618719, Q09). Raw xcodebuild output into a log —
      # `shell: bash` is what gives the pipe `pipefail`, so tee never hides xcodebuild's exit status.
      - id: test
        name: build · unit + vectors · journeys ①② (xcodebuild test · scheme CrewAll)
        continue-on-error: true
        shell: bash
        run: >
          cd ios && xcodebuild test -project Crew.xcodeproj -scheme CrewAll
          -destination "platform=iOS Simulator,name=$CREW_SIM,OS=latest"
          -resultBundlePath TestResults.xcresult
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
          OTHER_SWIFT_FLAGS="-continue-building-after-errors" 2>&1 | tee test.log
      # The verdict: the ONE step that passes or fails this job, and the first thing to read when it is red. It prints the
      # compile errors, failed assertions and suite totals to ITS OWN LOG (the headline is the first line under the ✗), to
      # the job summary page, and as GitHub annotations (clickable file:line at the top of the run and on the commit).
      # Run 34491587098 taught that a verdict written only to the summary page leaves the step log saying "exit code 1" and
      # nothing else. The logic lives in ios/scripts/verdict.sh so it can be run from Windows against a saved log.
      - name: verdict — read this first (compile errors · failing tests · totals)
        if: always()
        shell: bash
        run: bash ios/scripts/verdict.sh "${{ steps.test.outcome }}"
      # Always, not only on failure: TestResults.xcresult carries every test's screenshots (CrewUITests/Screenshots.swift),
      # which is how the app is LOOKED AT from a machine that is not a Mac. docs/testing-without-a-mac.md says how to read it.
      # J034 (A18, 2026-09-10) — that bundle now contains Home's four non-bridge states by name, from HomeStatesTests:
      # "S07 Home — rest day (the screen the owner photographed)" · "— workout day" · "— all done" · "— plan paused".
      # Before it, the only non-bridge Home any run had ever rendered was a workout day, which is why a rest-day defect
      # and a paused state that contradicted its own copy both shipped to TestFlight with every job green.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            ios/*.xcresult
            ios/*.log
            web/dev-server.log
